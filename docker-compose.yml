services:
  db:
    image: mysql:8.0
    container_name: habitlog-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpw}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-habitlog}
      MYSQL_USER: ${MYSQL_USER:-habitlog}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-habitlog}
    ports:
      # 3307 on the host so this never fights a locally installed MySQL on 3306.
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - habitlog-db-data:/var/lib/mysql
      # Scripts here run once, on first boot of an empty volume. That is why changing
      # schema means `npm run db:reset` (down -v) and not just a restart.
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # `docker compose up --wait` blocks on this, which is what makes a cold
      # `npm run dev` work on the first try instead of racing MySQL's init.
      #
      # This runs a real query as the *application* user against the application
      # database, because that is the actual precondition for the API booting.
      # `mysqladmin ping` is the usual choice and is a trap: it exits 0 even on
      # access denied, so it reports healthy before the seeded user exists.
      # CMD-SHELL (not CMD) so the password variable is expanded by a shell.
      test:
        [
          "CMD-SHELL",
          'mysql -h 127.0.0.1 -u "$$MYSQL_USER" -p"$$MYSQL_PASSWORD" -e "SELECT 1" "$$MYSQL_DATABASE"',
        ]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  habitlog-db-data:
